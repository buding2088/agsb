name: Keep Streamlit Alive

on:
  schedule:
    # UTC 时间每 30 分钟触发一次（Cron 语法）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支持在 GitHub 手动点击测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # 替换为你的 Streamlit 实际应用链接
          curl -s -o /dev/null -w "%{http_code}" https://chyuy2rgszgsw6xrujaqvv.streamlit.app
