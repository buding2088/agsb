name: Keep Streamlit Alive

on:
  schedule:
    # 每 30 分钟触发一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许手动点击测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://chyuy2rgszgsw6xrujaqvv.streamlit.app
